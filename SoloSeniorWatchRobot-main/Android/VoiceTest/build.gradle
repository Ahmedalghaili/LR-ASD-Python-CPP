// Zenbo Voice Test: a stand-alone app that only shows Zenbo's own voice
// direction (onDOA) as a coloured side. No server, camera or recording.
apply plugin: 'com.android.application'

android {
    compileSdk = 37
    namespace 'tw.edu.cgu.ai.voicetest'
    defaultConfig {
        applicationId 'tw.edu.cgu.ai.voicetest'
        minSdk 23
        targetSdk 23
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation files('../robot/src/Zenbo/libs/ZenboSDK.jar')
}
